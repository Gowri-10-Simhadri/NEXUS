<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" className="w-full h-full">
  <defs>
    <linearGradient id="nexusGrad1" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="nexusGrad2" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="nexusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Interconnected Intelligence Ring -->
  <circle cx="24" cy="24" r="20" stroke="url(#nexusGrad1)" stroke-width="2" stroke-linecap="round" stroke-dasharray="88 28" opacity="0.8" />
  
  <!-- Central Neural Nexus Core (Dynamic Hyper-Connected Hexagon / Diamond) -->
  <path d="M24 8L38 16V32L24 40L10 32V16L24 8Z" stroke="url(#nexusGrad1)" stroke-width="2.5" stroke-linejoin="round" fill="#0f172a" fill-opacity="0.6" filter="url(#nexusGlow)" />
  
  <!-- Inner Dynamic Synapse Nodes -->
  <line x1="24" y1="14" x2="24" y2="34" stroke="url(#nexusGrad1)" stroke-width="2" stroke-linecap="round" />
  <line x1="15" y1="20" x2="33" y2="28" stroke="url(#nexusGrad1)" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="15" y1="28" x2="33" y2="20" stroke="url(#nexusGrad1)" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Center Intelligence Beacon -->
  <circle cx="24" cy="24" r="4.5" fill="url(#nexusGrad2)" filter="url(#nexusGlow)" />
  <circle cx="24" cy="24" r="2" fill="#ffffff" />

  <!-- Outer Focus Nodes -->
  <circle cx="24" cy="8" r="2.5" fill="#8b5cf6" />
  <circle cx="38" cy="16" r="2" fill="#06b6d4" />
  <circle cx="38" cy="32" r="2" fill="#10b981" />
  <circle cx="24" cy="40" r="2" fill="#8b5cf6" />
  <circle cx="10" cy="32" r="2" fill="#06b6d4" />
  <circle cx="10" cy="16" r="2" fill="#ec4899" />
</svg>
